<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR CPR Case Simulation</title>
    <!-- โหลดไลบรารี A-Frame และ AR.js สำหรับทำ WebAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        /* ตกแต่งUI เมนูด้านล่างจอสำหรับกดดูขั้นตอน */
        .ui-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-family: 'Sarabun', sans-serif;
            text-align: center;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }
        button:hover { background-color: #c9302c; }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- ส่วนควบคุม UI แนะนำขั้นตอน -->
    <div class="ui-container">
        <h3 id="step-title" style="margin: 0 0 5px 0; font-size: 16px;">สแกน Marker เพื่อเริ่ม AR</h3>
        <p id="step-desc" style="margin: 0; font-size: 13px;">ส่องกล้องไปที่ Hiro Marker เพื่อดูโมเดลจำลอง AED</p>
        <button onclick="nextStep()">เปลี่ยนขั้นตอน (Next Step)</button>
    </div>

    <!-- ฉาก AR (A-Frame Scene) -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- กำหนดเป้าหมายการสแกน (ใช้ Marker พื้นฐานคือ hiro) -->
        <a-marker preset="hiro">
            
            <!-- โมเดลจำลอง 3 มิติ (ตัวอย่างใช้กล่องแทนเครื่อง AED หรือหุ่น CPR) -->
            <a-box position="0 0.5 0" material="color: red;" scale="0.8 0.8 0.8" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
            </a-box>

            <!-- ข้อความลอยตัวใน AR 3D Space -->
            <a-text value="เครื่อง AED จำลอง\nขั้นตอนที่ 1: เปิดเครื่อง" position="-1 1.5 0" scale="0.7 0.7 0.7" color="#ffffff"></a-text>
            
        </a-marker>

        <!-- กล้องสำหรับมือถือ -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // จำลองระบบกดเปลี่ยนสเต็ปคำแนะนำใน AR
        let currentStep = 1;
        const stepsData = [
            { title: "ขั้นตอนที่ 1: เปิดเครื่อง AED", desc: "เปิดฝาเครื่อง AED เสียงคำสั่งจะเริ่มทำงานทันที" },
            { title: "ขั้นตอนที่ 2: ติดแผ่น Pad", desc: "แปะแผ่น AED บริเวณใต้ไหปลาร้าขวา และชายโครงซ้าย" },
            { title: "ขั้นตอนที่ 3: วิเคราะห์คลื่นหัวใจ", desc: "ห้ามสัมผัสผู้ป่วย ตัวเครื่องกำลังวิเคราะห์จังหวะหัวใจ" },
            { title: "ขั้นตอนที่ 4: กดปุ่มช็อก (ถ้ามีคำสั่ง)", desc: "หากเครื่องสั่งให้ช็อก ให้กดปุ่ม Shock และเริ่ม CPR ต่อ" }
        ];

        function nextStep() {
            currentStep = (currentStep % stepsData.length);
            document.getElementById("step-title").innerText = stepsData[currentStep].title;
            document.getElementById("step-desc").innerText = stepsData[currentStep].desc;
            currentStep++;
        }
    </script>

</body>
</html>
